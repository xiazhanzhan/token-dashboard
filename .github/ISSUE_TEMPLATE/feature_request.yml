name: Feature request
description: Suggest a focused improvement for Token Dashboard
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: Please describe the user problem before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without including private data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: privacy
    attributes:
      label: Privacy impact
      options:
        - No change to collected or transmitted data
        - Changes local data storage
        - Changes remote data transmission
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap for a similar request.
          required: true
        - label: I have not included real credentials, session data, or personal information.
          required: true

