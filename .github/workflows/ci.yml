name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend -- --run
      - run: npm run build --prefix frontend

  host-packages:
    name: Build privacy-safe Host packages
    runs-on: macos-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
          command -v rg >/dev/null || brew install ripgrep
      - name: Build frontend and Host packages
        run: |
          npm run build --prefix frontend
          ./scripts/build-host-packages.sh
          cd dist
          shasum -a 256 Token-Dashboard-Host-macOS.zip \
            Token-Dashboard-Host-Windows-x64.zip > SHA256SUMS.txt
      - name: Upload package smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-dashboard-host-packages-${{ github.sha }}
          path: |
            dist/Token-Dashboard-Host-macOS.zip
            dist/Token-Dashboard-Host-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
