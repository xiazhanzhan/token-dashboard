name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
          npm ci --prefix frontend
          command -v rg >/dev/null || brew install ripgrep
      - name: Test and build release packages
        run: |
          backend/.venv/bin/python -m pytest -q
          npm test --prefix frontend -- --run
          npm run build --prefix frontend
          ./scripts/build-host-packages.sh
          cd dist
          shasum -a 256 Token-Dashboard-Host-macOS.zip \
            Token-Dashboard-Host-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          EXTRA=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then
            EXTRA+=(--prerelease)
          fi
          if [[ -f "$NOTES" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              dist/Token-Dashboard-Host-macOS.zip \
              dist/Token-Dashboard-Host-Windows-x64.zip \
              dist/SHA256SUMS.txt \
              --title "Token Dashboard ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" "${EXTRA[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Token-Dashboard-Host-macOS.zip \
              dist/Token-Dashboard-Host-Windows-x64.zip \
              dist/SHA256SUMS.txt \
              --title "Token Dashboard ${GITHUB_REF_NAME}" \
              --generate-notes "${EXTRA[@]}"
          fi
